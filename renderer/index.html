<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Content-Security-Policy"
    content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline';" />
  <title>Kelio en Electron - Poc Ludovic</title>
  <link rel="stylesheet" href="css/main.css" />
</head>
<body>
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-logo">
      <span class="logo-icon">⬡</span>
      <span class="logo-text">Kelio en Electron - Poc Ludovic</span>
    </div>
    <nav class="sidebar-nav">
      <a href="#" class="nav-item active" data-page="dashboard">
        <span class="nav-icon">◈</span>
        <span class="nav-label">
          <span class="nav-label-main">Tableau de bord</span>
          <span class="nav-label-sub">Vue d'ensemble</span>
        </span>
      </a>
      <a href="#" class="nav-item" data-page="extraction">
        <span class="nav-icon">⟳</span>
        <span class="nav-label">
          <span class="nav-label-main">Extraction</span>
          <span class="nav-label-sub">Lancer un import API</span>
        </span>
      </a>
      <a href="#" class="nav-item" data-page="results">
        <span class="nav-icon">◆</span>
        <span class="nav-label">
          <span class="nav-label-main">Résultats</span>
          <span class="nav-label-sub">Compteurs Kelio</span>
        </span>
      </a>
      <a href="#" class="nav-item" data-page="data">
        <span class="nav-icon">▦</span>
        <span class="nav-label">
          <span class="nav-label-main">Données</span>
          <span class="nav-label-sub">Salariés, badgeages, absences…</span>
        </span>
      </a>
      <a href="#" class="nav-item" data-page="history">
        <span class="nav-icon">◷</span>
        <span class="nav-label">
          <span class="nav-label-main">Historique</span>
          <span class="nav-label-sub">Journal des extractions</span>
        </span>
      </a>
      <a href="#" class="nav-item" data-page="settings">
        <span class="nav-icon">⚙</span>
        <span class="nav-label">
          <span class="nav-label-main">Paramètres</span>
          <span class="nav-label-sub">Connexion Kelio</span>
        </span>
      </a>
      <a href="#" class="nav-item" data-page="sql">
        <span class="nav-icon">💾</span>
        <span class="nav-label">
          <span class="nav-label-main">SQL</span>
          <span class="nav-label-sub">Requêtes personnalisées</span>
        </span>
      </a>
    </nav>
    <div class="sidebar-version" id="appVersion"></div>
  </aside>

  <main class="content" id="mainContent">
    <!-- Les pages sont injectées ici par app.js -->
  </main>

  <div class="toast-container" id="toastContainer"></div>

  <script src="js/utils.js"></script>
  <script src="js/toast.js"></script>
  <script src="js/pages/dashboard.js"></script>
  <script src="js/pages/extraction.js"></script>
  <script src="js/pages/results.js"></script>
  <script src="js/pages/history.js"></script>
  <script src="js/pages/data.js"></script>
  <script src="js/pages/settings.js"></script>
  <script src="js/pages/sql.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
